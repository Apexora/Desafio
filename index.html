<style>
  
:root{
  --bg:#eeeaf5;--bg2:#e3ddf0;--surface:#fbf9ff;--surface2:#ece7f7;--line:#c9c1de;
  --text:#1c1840;--muted:#5a5683;--acc:#a8993a;--on-acc:#331c15;--acc-text:#7a4d00;
  --ape:#34407f;--bad:#b3301f;--ember:#c4501f;
  --display:'Unbounded','Trebuchet MS',system-ui,sans-serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a0d0b;--bg2:#2a1420;--surface:#43203f;--surface2:#522a4d;--line:#6a3a5c;
    --text:#f7ecdf;--muted:#d0b4a8;--acc:#e8b47f;--on-acc:#331c15;--acc-text:#e8b47f;
    --ape:#b94a6e;--bad:#d9706c;--ember:#d9706c;
  }
}
:root[data-theme="dark"]{
  --bg:#1a0d0b;--bg2:#2a1420;--surface:#43203f;--surface2:#522a4d;--line:#6a3a5c;
  --text:#f7ecdf;--muted:#d0b4a8;--acc:#e8b47f;--on-acc:#331c15;--acc-text:#e8b47f;
  --ape:#b94a6e;--bad:#d9706c;--ember:#d9706c;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc-text);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}

.app{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:100%}
.rail{background:var(--bg2);border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;align-self:start;max-height:calc(100dvh - env(safe-area-inset-top,0px));overflow:auto}
.rail h2{font-family:var(--display);font-weight:600;font-size:.8rem;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.rail h2 span{font-family:var(--body);font-weight:400;color:var(--muted);font-size:.85rem}
.pl-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pl{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pl.on{border-color:var(--acc-text);box-shadow:inset 5px 0 0 var(--acc)}
.pl-main{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:0 10px;align-items:center;width:100%;padding:11px 14px;cursor:pointer}
.pl-main:focus-visible{outline:3px solid var(--acc-text);outline-offset:-3px}
.pl-name{font-weight:700;overflow-wrap:anywhere}
.pl-char{grid-column:1;color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.pl-pts{grid-row:1/3;grid-column:2;font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--acc-text);font-variant-numeric:tabular-nums}
.pl-lead{font-size:.75rem;color:var(--acc-text);font-weight:700}
.bump{animation:bump .7s ease}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.35)}100%{transform:scale(1)}}
.pl-tools{display:flex;gap:6px;padding:0 10px 10px}
.mini{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:4px 10px;font-size:.85rem;font-weight:700}
.mini:hover{border-color:var(--acc-text)}
.pl.all .pl-pts{display:none}
.empty{color:var(--muted);font-size:.95rem;padding:6px 2px 14px}
.add{margin-top:16px;display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:16px}
.add label{font-size:.8rem;color:var(--muted)}
.fld{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.fld:focus{outline:3px solid var(--acc-text);outline-offset:1px}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between;padding:18px 34px;border-bottom:1px solid var(--line)}
.brand{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.15rem}
.brand:focus-visible{outline:3px solid var(--acc-text);outline-offset:4px}
.nav{display:flex;flex-wrap:wrap;gap:4px}
.nav button{background:none;border:0;border-bottom:3px solid transparent;padding:6px 12px;font-weight:700;color:var(--muted)}
.nav button:hover{color:var(--text)}
.nav button[aria-current="page"]{color:var(--text);border-bottom-color:var(--acc)}
.content{padding:34px;flex:1}
.hints{padding:14px 34px;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem}
kbd{background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:0 6px;font-family:inherit;font-weight:700;font-size:.8rem}

.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:11px 20px;font-weight:700}
.btn:hover:not(:disabled){border-color:var(--acc-text)}
.btn.pri{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.btn.pri:hover:not(:disabled){filter:brightness(1.06)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:var(--bad);background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,520px);gap:40px;align-items:center}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,4.6vw,4.2rem);line-height:1.05;letter-spacing:-.02em}
.hero .lead{margin:20px 0 28px;font-size:1.2rem;color:var(--muted);max-width:34em}
.ringwrap{position:relative;width:100%;aspect-ratio:1}
.ringwrap svg{width:100%;height:100%;display:block;overflow:visible}
.ringc{position:absolute;inset:27%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;gap:4px}
.ringc h3{font-family:var(--display);font-weight:800;font-size:clamp(1.2rem,2.6vw,2rem)}
.ringc p{color:var(--muted);font-size:.95rem;line-height:1.3}
.dn{cursor:pointer;outline:none}
.dn circle{fill:var(--surface);stroke:var(--line);stroke-width:2;transition:stroke .2s}
.dn.ape circle{stroke:var(--ape)}.dn.xora circle{stroke:var(--acc-text)}
.dn:hover circle,.dn:focus circle,.dn.sel circle{stroke:var(--text);stroke-width:3}
.dn .ini{font-family:var(--display);font-weight:800;font-size:15px;fill:var(--text);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.dn .lab{font-size:12px;font-weight:700;fill:var(--muted);text-anchor:middle;pointer-events:none}
.bond{stroke:var(--line);stroke-width:2;fill:none}
.bond.crack{stroke:var(--ember);stroke-width:2.5;stroke-linejoin:bevel}
.crater{fill:none;stroke:var(--line);stroke-dasharray:2 7;stroke-linecap:round}
.craterfill{fill:var(--surface)}

/* retos */
h1.page{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,3vw,2.6rem);letter-spacing:-.01em;margin-bottom:8px}
.sub{color:var(--muted);margin-bottom:28px;max-width:40em}
.modes{display:grid;border-top:1px solid var(--line)}
.mode{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 24px;align-items:center;padding:22px 8px;border-bottom:1px solid var(--line)}
.mode:hover{background:var(--surface)}
.mode:focus-visible{outline:3px solid var(--acc-text);outline-offset:-3px}
.mode b{font-family:var(--display);font-weight:600;font-size:1.35rem}
.mode span{color:var(--muted)}
.mode em{grid-row:1/3;grid-column:2;font-style:normal;font-family:var(--display);font-weight:600;color:var(--acc-text);white-space:nowrap}

/* play */
.playhead{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;margin-bottom:22px}
.turn{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 20px 8px 10px}
.turn i{width:34px;height:34px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-style:normal}
.turn span{color:var(--muted);font-size:.85rem;display:block;line-height:1}
.turn b{font-family:var(--display);font-weight:600;font-size:1.1rem}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,3.4vw,44px)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-weight:700;font-size:.95rem;margin-bottom:18px}
.meta .gem{color:var(--acc-text);letter-spacing:.1em}
.q{font-weight:700;font-size:clamp(1.5rem,2.5vw + .6rem,2.6rem);line-height:1.22;max-width:30em;margin-bottom:30px;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.opts.two{max-width:760px}
.opt{position:relative;overflow:hidden;text-align:left;display:flex;gap:14px;align-items:center;background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:18px 20px;font-size:clamp(1.05rem,1.2vw + .6rem,1.5rem);font-weight:600;min-height:76px}
.opt>*{position:relative;z-index:1}
.opt .lt{font-family:var(--display);font-weight:800;color:var(--acc-text);min-width:1.4em}
.opt:hover:not(:disabled){border-color:var(--acc-text)}
.opt.chosen{border-color:var(--acc-text);border-style:dashed}
.opt .tag{margin-left:auto;font-size:.75rem;font-weight:700;color:var(--muted);text-align:right}
.opt::before{content:"";position:absolute;inset:0;background:var(--acc);opacity:0;z-index:0}
.opt.right{color:var(--on-acc);border-color:var(--acc)}
.opt.right .lt,.opt.right .tag{color:var(--on-acc)}
.opt.right::before{opacity:1;clip-path:polygon(0 0,100% 0,94% 22%,100% 46%,92% 70%,100% 100%,0 100%,0 50%);animation:crack .7s cubic-bezier(.6,0,.2,1)}
@keyframes crack{from{clip-path:polygon(0 0,0 0,0 22%,0 46%,0 70%,0 100%,0 100%,0 50%)}}
.opt.wrong{border-color:var(--bad);color:var(--bad)}
.opt.wrong .lt{color:var(--bad)}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}
.peek::after{content:"";position:absolute;right:10px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--acc-text);opacity:.7;z-index:2}
.ctrls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:28px}
.timer{display:flex;align-items:center;gap:14px;margin-left:auto;min-width:200px}
.tnum{font-family:var(--display);font-weight:800;font-size:2.2rem;min-width:2.2ch;text-align:right;font-variant-numeric:tabular-nums}
.tnum.low{color:var(--bad)}
.tbar{flex:1;height:10px;background:var(--bg2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.tbar i{display:block;height:100%;background:var(--acc);width:100%;transition:width 1s linear}
.tbar i.low{background:var(--bad)}
.result{margin-top:26px;border-top:1px dashed var(--line);padding-top:22px}
.verdict{font-family:var(--display);font-weight:800;font-size:1.5rem;margin-bottom:8px}
.verdict.ok{color:var(--acc-text)}.verdict.no{color:var(--bad)}
.result p{max-width:44em;font-size:1.1rem}
.cheat{margin-top:16px;font-size:.85rem;color:var(--muted);font-style:italic}
.clues{list-style:none;counter-reset:c;margin:0 0 8px;padding:0;display:grid;gap:12px;max-width:44em}
.clues li{counter-increment:c;display:grid;grid-template-columns:2.2em 1fr;gap:6px;font-size:clamp(1.15rem,1.4vw + .6rem,1.7rem);font-weight:600;line-height:1.3}
.clues li::before{content:counter(c);font-family:var(--display);font-weight:800;color:var(--acc-text)}
.answer{margin-top:20px;background:var(--bg2);border-radius:12px;padding:18px 22px;max-width:44em}
.answer h3{font-family:var(--display);font-weight:800;font-size:1.8rem;margin-bottom:6px}
.evs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ev{background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:16px 20px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px}
.ev .lt{grid-row:1/3;font-family:var(--display);font-weight:800;font-size:1.8rem;color:var(--acc-text);align-self:center;min-width:1.2em}
.ev b{font-size:1.25rem}.ev span{color:var(--muted)}
.ev .yr{grid-column:2;font-family:var(--display);font-weight:800;color:var(--acc-text);font-size:1.1rem}
.ev.done{border-color:var(--acc-text)}
.twist{margin-top:20px;border-left:5px solid var(--ember);padding:10px 18px;background:var(--bg2);border-radius:0 12px 12px 0;font-size:1.25rem;font-weight:600}
.place{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:2px 14px;font-weight:700;font-size:.9rem;color:var(--muted)}
.rt{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,2.6vw,2.6rem);margin:14px 0}
.scenetxt{font-size:clamp(1.15rem,1.4vw + .6rem,1.7rem);max-width:36em;line-height:1.4;font-weight:500}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:4px 14px;font-size:.9rem;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.banner{border:1px dashed var(--acc-text);border-radius:12px;padding:14px 18px;margin-bottom:22px;color:var(--muted)}

/* dice */
.dgrid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:34px}
.dctl{display:grid;gap:18px;align-content:start}
.dctl label{font-weight:700;font-size:.9rem;color:var(--muted);display:block;margin-bottom:6px}
.sides{display:flex;flex-wrap:wrap;gap:8px}
.step{display:flex;align-items:center;gap:10px}
.step b{font-family:var(--display);min-width:2.5ch;text-align:center;font-size:1.2rem}
.dres{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;text-align:center;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px}
.dnum{font-family:var(--display);font-weight:800;font-size:clamp(4rem,11vw,9rem);line-height:1;font-variant-numeric:tabular-nums}
.dnum.crit{color:var(--acc-text)}.dnum.fumble{color:var(--bad)}
.dbrk{color:var(--muted);font-size:1.1rem}
.dtag{font-family:var(--display);font-weight:800;font-size:1.3rem}
.hist{margin:26px 0 0;padding:0;list-style:none;display:grid;gap:4px;color:var(--muted)}
.hist b{color:var(--text)}

/* registro */
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:34px}
.panel h2{font-family:var(--display);font-weight:600;font-size:1.1rem;margin-bottom:14px}
.set{display:grid;gap:14px}
.set label{display:grid;gap:4px;font-weight:700;font-size:.9rem}
.set label.chk{grid-template-columns:auto 1fr;align-items:center;gap:10px}
.set small{color:var(--muted);font-weight:400}
.log{list-style:none;margin:0;padding:0;max-height:420px;overflow:auto;border-top:1px solid var(--line)}
.log li{display:flex;gap:12px;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--line);font-size:.95rem}
.log time{color:var(--muted);font-size:.8rem;white-space:nowrap}
.log .d{font-family:var(--display);font-weight:600;white-space:nowrap}
.log .d.p{color:var(--acc-text)}.log .d.n{color:var(--bad)}
textarea.fld{min-height:110px;font-family:ui-monospace,monospace;font-size:.8rem}

dialog{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:26px;max-width:min(460px,92vw);width:100%}
dialog::backdrop{background:rgba(18,8,8,.7)}
dialog h3{font-family:var(--display);font-weight:600;font-size:1.15rem;margin-bottom:14px}
dialog .set{margin-bottom:18px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--acc);color:var(--on-acc);font-weight:700;border-radius:99px;padding:10px 22px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

.bank .errs{color:var(--bad);margin:8px 0 6px;padding-left:20px}
@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  .rail{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}
  .pl-list{display:flex;overflow-x:auto;padding-bottom:6px}
  .pl{min-width:190px;flex:0 0 auto}
  .hero,.dgrid,.cols{grid-template-columns:1fr}
  .top,.content,.hints{padding-left:18px;padding-right:18px}
}
@media (max-width:640px){
  .opts,.evs{grid-template-columns:1fr}
  .rw{grid-template-columns:1fr auto}
  .rw .btn,.rw .row{grid-column:1/3;grid-row:auto}
  .cost{grid-row:1}
  .timer{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){
  .bump,.opt.right::before{animation:none}
  .tbar i,#toast{transition:none}
}
.imgbox{display:inline-block;max-width:100%;overflow:hidden;border-radius:14px;line-height:0;background:var(--bg2)}
.imgbox img{display:block;max-width:100%;max-height:60dvh;object-fit:contain;transition:filter .7s ease}
@media (prefers-reduced-motion:reduce){.imgbox img{transition:none}}
html.embed.embed{--bg:#1a0d0b;--bg2:#2a1420;--surface:#43203f;--surface2:#522a4d;--line:#e8b47f44;--text:#f7ecdf;--muted:#d0b4a8;--acc:#e8b47f;--on-acc:#331c15;--acc-text:#f0c79a;--ape:#b94a6e;--bad:#d9706c;--ember:#d9706c;--display:'Cinzel',Georgia,serif;--body:'Crimson Pro',Georgia,serif}
html.embed body{background:transparent;font-size:18px}
html.embed .brand{display:none}
html.embed .top{padding:12px 24px}
html.embed .btn,html.embed .pl,html.embed .panel{border-radius:14px}
html.embed h1,html.embed h2{text-transform:uppercase;letter-spacing:.04em}
</style>
<style id="goty">
:root,:root[data-theme="dark"]{--bg:#1a0d0b;--bg2:#241018cc;--surface:#2a142099;--surface2:#1c2556aa;--line:#ffffff1f;--text:#f7ecdf;--muted:#d0b4a8;--acc:#e8b47f;--on-acc:#331c15;--acc-text:#f0c79a;--ape:#b94a6e;--bad:#d9706c;--ember:#d9706c;--glow:0 0 24px #e8b47f66}
body{background:#1a0d0b;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;background:radial-gradient(40% 35% at 20% 15%,#34407f77,transparent 70%),radial-gradient(35% 40% at 85% 25%,#e8b47f44,transparent 70%),radial-gradient(45% 40% at 55% 95%,#0f9e9a55,transparent 70%);animation:aur 22s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.07;background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}

function pick(mode,pool){
 let used=S.used[mode]=S.used[mode]||[];
 let av=pool.filter(x=>!used.includes(x.id));
 if(!av.length){S.used[mode]=used=[];av=pool.slice()}
 const it=av[Math.floor(Math.random()*av.length)];used.push(it.id);save();return it;
}
function newItem(mode){
 if(mode==="trivia"){
  const all=poolOf("trivia",TRIVIA);let pool=all.filter(t=>(F.cat==="Todas"||t.cat===F.cat)&&(!F.lvl||t.lvl===F.lvl));
  if(!pool.length)pool=all;
  const t=pick("trivia",pool),opts=shuffle([t.right,...t.wrong]);
  return Object.assign({},t,{opts,ai:opts.indexOf(t.right)});
 }
 if(mode==="vof"){const v=pick("vof",poolOf("vof",VOF));return Object.assign({},v,{opts:["Verdadero","Falso"],ai:v.t?0:1})}
 if(mode==="quien")return pick("quien",poolOf("quien",QUIEN));
 if(mode==="rol")return pick("rol",poolOf("rol",ROL));
 if(mode==="imagen")return IMGS.length?pick("imagen",IMGS):null;
 if(mode==="crono"){
  const cc=cust("crono"),cp=S.settings.onlyCustom&&cc.length>=4?cc:CRONO.concat(cc);
  const evs=shuffle(cp).slice(0,4);
  return {evs,order:evs.slice().sort((a,b)=>a.y-b.y)};
 }
}

function stageChoice(){
 const it=C.item,v=C.mode==="vof";
 const gems="◆".repeat(it.lvl)+"◇".repeat(3-it.lvl);
 const correct=C.chosen!=null?C.chosen===it.ai:null;
 let opts=it.opts.map((o,i)=>{
  const cl=["opt"];if(C.chosen===i)cl.push("chosen");if(C.hide&&C.hide.includes(i))cl.push("gone");
  if(C.revealed){if(i===it.ai&&correct===true)cl.push("right");else if(C.chosen===i)cl.push("wrong");else cl.push("dim")}
  else if(S.settings.cheat&&i===it.ai)cl.push("peek");
  const tag=C.chosen===i?(C.revealed?(i===it.ai?"Su respuesta ✓":"Su respuesta ✗"):"Su respuesta"):"";
  return `<button class="${cl.join(" ")}" data-act="choose" data-i="${i}" ${C.revealed?"disabled":""} aria-pressed="${C.chosen===i}"><span class="lt">${v?(i?"F":"V"):LET[i]}</span><span>${esc(o)}</span><span class="tag">${tag}</span></button>`;
 }).join("");
 let res="";
 if(C.revealed){
  const vt=C.timeUp&&correct===null?"⏱ Se acabó el tiempo":correct===null?"Respuesta revelada":correct?"✓ Correcto":"✗ Incorrecto";
  res=`<div class="result"><div class="verdict ${correct===true?"ok":(correct===false||C.timeUp)?"no":""}">${vt}</div><p>${correct!==true?`La respuesta era <b>${esc(it.opts[it.ai])}</b>. `:""}${esc(it.exp||"")}</p>${nextBar()}</div>`;
 }
 return `<div class="stage"><div class="meta">${v?"Verdadero o falso":esc(it.cat)}<span class="gem" aria-label="dificultad ${it.lvl} de 3">${gems}</span><span>${C.pts} ${cur().toLowerCase()}</span></div>
 <h2 class="q">${esc(it.q)}</h2><div class="opts ${v?"two":""}">${opts}</div>
 <div class="ctrls">${C.revealed?"":`${v?"":`<button class="btn" data-act="hint50" ${C.hinted?"disabled":""}>${C.hinted?"Pista usada":"Pista 50/50 · −50% pts"}</button>`}`}${timerHTML()}</div>
 ${cheatLine(it.opts[it.ai])}${res}</div>`;
}

/* ===== retos diarios: estado, racha y registro ===== */
const STREAK_NEEDS_WIN=false; /* false: la racha 🔥 cuenta cada día que juegas · true: solo sube si ganas ese día */
const GAME_ORDER=["trivia","vof","quien","imagen","crono","wordle","conex","impostor","top10"];
const GAME_COLOR={trivia:"#e8b47f",quien:"#b94a6e",vof:"#0f9e9a",crono:"#d9706c",imagen:"#34407f",wordle:"#6b9e72",conex:"#a8993a",impostor:"#b94a6e",top10:"#0f9e9a"};
const GAME_ICON={trivia:"📜",quien:"🎭",vof:"⚖️",crono:"⏳",imagen:"🔮",wordle:"🔤",conex:"🧩",impostor:"🕵️",top10:"🔟"};
/* palabras del récord de cada juego: [gana (1), gana (varios), pierde (1), pierde (varios)] */
const REC_LABEL={trivia:["acierto","aciertos","fallo","fallos"],vof:["acierto","aciertos","fallo","fallos"],
 quien:["resuelto","resueltos","sin resolver","sin resolver"],imagen:["resuelto","resueltos","sin resolver","sin resolver"],
 crono:["ganada","ganadas","perdida","perdidas"]};
const dayKey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayKey=()=>dayKey(new Date());
const prevKey=k=>{const p=k.split("-").map(Number);return dayKey(new Date(p[0],p[1]-1,p[2]-1))};
const nextMidnight=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate()+1)};
function cdText(){const s=Math.max(0,Math.floor((nextMidnight()-new Date())/1000));return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,"0")).join(":")}
const DG=m=>{S.daily=S.daily||{};return S.daily[m]||(S.daily[m]={last:"",streak:0,best:0,wins:0,losses:0,pending:"",today:null})};
function streakOf(g){const t=todayKey();return g.last===t||g.last===prevKey(t)?g.streak:0}
function finishDaily(m,win,txt,dk){
 const g=DG(m);dk=dk||g.pending||todayKey();
 if(g.last&&g.last>=dk){g.pending="";save();return}
 g.streak=(STREAK_NEEDS_WIN&&!win)?0:(g.last===prevKey(dk)?g.streak+1:1);
 g.best=Math.max(g.best||0,g.streak);g.last=dk;g.pending="";
 if(win)g.wins++;else g.losses++;
 g.today={d:dk,win:!!win,txt:txt||""};save();
 /* esencias del Portal: una vez por modo y día (el return de arriba evita repetir) */

const INIT={

<script>
/* ===== Apexora tic tac toe · tres en línea contra el bot =====
   Tablero 3x3: cada fila y cada columna tiene una condición del lore.
   Para reclamar una casilla nombras a un personaje o dios que cumpla las dos.
   Si fallas pierdes el turno. Cada nombre se usa una sola vez.
   Para ampliar el juego edita TT_E (personajes) y TT_CR (condiciones). */
(function(){
const TT_WIN=50,TT_HINT=5,TT_MISS=5,TT_MIN=10,TT_BOT=.8,TT_MAXHINT=3; /* puntos, penalizaciones, acierto del bot, pistas */
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
/* condiciones: id -> [nombre corto, explicación al pasar el cursor] */
const TT_CR={
 camp:["Campamento Sopharum","Miembro del campamento que fundó Mit Caleus"],
 torneo:["Torneo de Umbra","Presente en el Torneo de Umbra (participante, público o saboteador)"],
 hz:["Historia de Zarick","Aparece en la vida de Zarick"],
 hk:["Historia de Karim","Aparece en la vida de Karim Balteus"],
 umbra:["Umbra","Nació, creció o actúa en Umbra"],
 arboris:["Arboris","Ligado a Arboris"],
 lumx:["Luminarae Luxor","Ligado a Luminarae Luxor (origen, familia, servicio, fe u honra)"],
 skald:["Skaldrum","Ligado a Skaldrum (incluye a su dios venerado)"],
 sinf:["Sinfalía","Ligado a Sinfalía"],
 psyb:["Psybernia","Ligado a Psybernia"],
 negatt:["Negatt","Ligado a Negatt"],
 lumis:["Lumis","Ligado a Lumis (nació cerca, vivió, fue preso o la gobierna)"],
 deidad:["Deidad","Una de las diez fuerzas, hijas de Espacio"],
 lider:["Líder","Lidera un grupo, una orden, una pandilla o una nación"],
 orco:["Orco o semi-orco","Sangre de orco"],
 tec:["Implantes o tecnología","Implantes, armadura robótica, traje simbiótico o IA"],
 orden:["Criado por una orden","Lo crió o adoptó una orden desde niño"]
};
/* personajes: [nombre, condiciones que cumple, apodos para la búsqueda] */
const TT_E=[
["Zarick",["camp","torneo","hz","hk","umbra","arboris","lumx","lumis","orco"],[]],
["Bane Ironhand",["camp","torneo","hz","lumis","tec"],["bane"]],
["Karim Balteus",["camp","torneo","hk","lumx","orden"],["karim"]],
["Vina Miceus",["camp","torneo","skald"],["vina"]],
["Seah de Pato",["camp","torneo"],["seah"]],
["Tomah de la Luz de Xora",["camp","torneo","lumx"],["tomah"]],
["Pin Kuku",["camp","torneo"],["pin"]],
["Mit Caleus",["camp","torneo","hz","hk","umbra","lumis","lider"],["caleus"]],
["Andreas Light",["torneo","lumx","orden","tec"],["andreas","leon skyrider"]],
["Puj",["torneo","hz","umbra","lider"],[]],
["Astra Skyfall",["torneo","lumx"],["astra"]],
["Solara",["torneo"],[]],
["Lyra Shadowthorn",["torneo"],["lyra"]],
["Ova Caleus",["torneo"],["ova"]],
["Lurim de Skaldrum",["torneo","skald"],["lurim"]],
["Oci",["torneo","skald"],[]],
["Vela",["torneo","lumis"],[]],
["Burun",["torneo"],[]],
["Orx",["torneo"],[]],
["Aurora D'arwen",["torneo"],["aurora"]],
["Piuk",["torneo"],[]],["Asan",["torneo"],[]],["Willow",["torneo"],[]],["Krymm",["torneo"],[]],["Garvok",["torneo"],[]],
["Gobz Gobinson",["psyb","sinf","tec"],["gobz"]],
["Valeria",["psyb","lider"],[]],
["Tsuji",["negatt"],[]],
["Alnasi",["negatt","lider"],[]],
["Raulo Casa III",["negatt","lider"],["raulo"]],
["Inargo",["lumis","tec","lider"],[]],
["Evelyn von Grace",["hz","umbra","arboris","lumx"],["evelyn"]],
["Luminara IV",["lumx","lider"],["luminara"]],
["Khagzol «Zodd» Shazolg",["hz","arboris","orco"],["zodd","khagzol"]],
["Heiss",["hz"],[]],
["Saúl",["hk","orden"],["saul"]],
["Calliope",["hk"],[]],
["RiaRia",["hk"],[]],
["Ape",["deidad","skald"],[]],
["Xora",["deidad","lumx"],[]],
["Ganore",["deidad","sinf"],[]],
["Millot",["deidad"],[]],["Jilper",["deidad"],[]],["Cumacur",["deidad"],[]],["Cabala",["deidad"],[]],
["Kiprika",["deidad"],["ki"]],["Tapiem",["deidad"],[]],["Dacama",["deidad"],[]]
];
const CR=TT_CR,E=TT_E,IDS=Object.keys(CR);
const nz=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const NM=E.map(e=>nz(e[0])),HAY=E.map(e=>nz(e[0]+" "+e[2].join(" ")));
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const ANS={};
function ans(r,c){const k=r+"|"+c;return ANS[k]||(ANS[k]=E.map((e,i)=>e[1].includes(r)&&e[1].includes(c)?i:-1).filter(i=>i>=0))}
function comb(a,k){return k===0?[[]]:a.flatMap((x,i)=>comb(a.slice(i+1),k-1).map(r=>[x,...r]))}
/* ¿se pueden llenar las 9 casillas con 9 personajes distintos? (así nunca hay un tablero imposible) */
function perfect(cells){const own={};const tr=(i,seen)=>{for(const e of cells[i]){if(seen.has(e))continue;seen.add(e);if(own[e]==null||tr(own[e],seen)){own[e]=i;return true}}return false};
 for(let i=0;i<cells.length;i++)if(!tr(i,new Set()))return false;return true}
let BOARDS=null;
function boards(){
 if(BOARDS)return BOARDS;const out=[];
 for(const R of comb(IDS,3))for(const C of comb(IDS.filter(x=>!R.includes(x)),3)){
  const cells=[];let ok=true,sum=0;
  for(const r of R){for(const c of C){const a=ans(r,c);if(!a.length){ok=false;break}cells.push(a);sum+=a.length}if(!ok)break}
  if(ok&&perfect(cells))out.push({R,C,sum});
 }
 const good=out.filter(b=>b.sum>=18);BOARDS=good.length>=10?good:out;return BOARDS;
}
let G={};
function init(){
 const bs=boards(),b=bs[Math.floor(Math.random()*bs.length)];
 G={R:sh(b.R),C:sh(b.C),b:Array(9).fill(null),used:new Set(),turn:"p",sel:null,q:"",msg:"",mk:"",hn:0,miss:0,hint:{},over:false,line:[],tok:Math.random()};
}
const rl=i=>CR[G.R[Math.floor(i/3)]][0],cl=i=>CR[G.C[i%3]][0];
const cellName=i=>rl(i)+" × "+cl(i);
const valid=(i,e)=>{const t=E[e][1];return t.includes(G.R[Math.floor(i/3)])&&t.includes(G.C[i%3])};
const openCells=()=>G.b.map((x,i)=>x?-1:i).filter(i=>i>=0);
const avail=i=>ans(G.R[Math.floor(i/3)],G.C[i%3]).filter(e=>!G.used.has(e));
const lineWin=(w,cell)=>LINES.some(l=>l.includes(cell)&&l.every(j=>j===cell||(G.b[j]&&G.b[j].w===w)));
function finish(res,line){
 G.over=true;G.res=res;G.line=line||[];
 const pts=res==="win"?Math.max(TT_MIN,TT_WIN-TT_HINT*G.hn-TT_MISS*G.miss):0;G.pts=pts;
 G.txt=res==="win"?`Completaste una línea de tres. Fallos: ${G.miss} · pistas: ${G.hn}.`:res==="lose"?"El bot completó una línea de tres.":"No quedan personajes que encajen en las casillas libres.";
 if(res==="win")award(pts,"Apexora tic tac toe");
 dailyEnd(res==="win",res==="win"?"Victoria contra el bot":res==="draw"?"Empate con el bot":"Perdiste contra el bot");
}
function endCheck(){
 for(const l of LINES){const[a,b,c]=l;if(G.b[a]&&G.b[b]&&G.b[c]&&G.b[a].w===G.b[b].w&&G.b[b].w===G.b[c].w){finish(G.b[a].w==="p"?"win":"lose",l);return true}}
 const op=openCells();if(!op.length||!op.some(i=>avail(i).length)){finish("draw");return true}
 return false;
}
function claim(i,e,w){G.b[i]={w,e};G.used.add(e);endCheck()}
function botPick(){
 const cand=openCells().filter(i=>avail(i).length);if(!cand.length)return -1;
 const pr=[...cand.filter(i=>lineWin("b",i)),...cand.filter(i=>lineWin("p",i)),...(cand.includes(4)?[4]:[]),
  ...sh(cand.filter(i=>[0,2,6,8].includes(i))),...sh(cand.filter(i=>[1,3,5,7].includes(i)))];
 return pr[0];
}
function botMove(){
 const i=botPick();if(i<0){finish("draw");return}
 if(Math.random()<TT_BOT){const a=avail(i),e=a[Math.floor(Math.random()*a.length)];claim(i,e,"b");G.msg=`El bot reclamó «${E[e][0]}» en ${cellName(i)}.`;G.mk="";if(!G.over)sfx("click")}
 else{G.msg=`El bot no supo qué nombrar en ${cellName(i)} y pierde el turno.`;G.mk="ok";sfx("coin")}
 if(!G.over)G.turn="p";
}
function schedule(){const g=G;setTimeout(()=>{if(G!==g||g.over||!C||C.mode!=="tateti"||view!=="play")return;botMove();render()},900)}
function results(){
 const q=nz(G.q||"");if(!q)return[];const tk=q.split(" ");
 return E.map((e,i)=>i).filter(i=>!G.used.has(i)&&tk.every(t=>HAY[i].includes(t)))
  .sort((a,b)=>(NM[b].startsWith(q)-NM[a].startsWith(q))||a-b).slice(0,12);
}
function listHTML(){
 if(!nz(G.q||""))return`<li class="tt-empty">Escribe un nombre para buscar…</li>`;
 const r=results();if(!r.length)return`<li class="tt-empty">Nadie coincide con eso, o ya se usó en esta partida.</li>`;
 return r.map(i=>`<li><button class="btn tt-opt" data-act="ttpick" data-n="${i}">${esc(E[i][0])}</button></li>`).join("");
}
function focusQ(){setTimeout(()=>{const q=$("#tt-q");if(q){q.focus();try{q.setSelectionRange(q.value.length,q.value.length)}catch(e){}}},0)}
function res(){
 if(!G.over)return"";
 const v=G.res==="win"?`<div class="verdict ok">¡Victoria! +${G.pts}</div>`:G.res==="lose"?`<div class="verdict no">Derrota</div>`:`<div class="tt-verdict">Empate</div>`;
 const pos=G.b.map((x,i)=>x?"":`<li><b>${esc(cellName(i))}</b>: ${esc(ans(G.R[Math.floor(i/3)],G.C[i%3]).filter(e=>!G.used.has(e)).map(e=>E[e][0]).join(", ")||"sin respuestas libres")}</li>`).join("");
 return`<div class="result">${v}<p>${esc(G.txt)}</p>${pos?`<details class="tt-ans"><summary>Ver las respuestas que quedaron libres</summary><ul>${pos}</ul></details>`:""}${nextBar()}</div>`;
}
function V(){
 let h=`<div class="stage tt"><p class="tt-how">Toca una casilla y nombra a un personaje o dios que cumpla <b>las dos</b> condiciones: la de su fila y la de su columna. Si fallas, pierdes el turno, y cada nombre se usa una sola vez. Tú eres ✕ y empiezas; gana quien una tres casillas en línea.</p>
 <p class="meta"><span class="gem">${G.over?"Partida terminada":G.turn==="p"?"Tu turno · ✕":"Turno del bot · ○"}</span><span>Fallos: ${G.miss}</span><span>Pistas: ${G.hn} de ${TT_MAXHINT}</span></p>
 <div class="tt-board" role="group" aria-label="Tablero de tres en línea"><div></div>${G.C.map(c=>`<div class="tt-h" title="${esc(CR[c][1])}">${esc(CR[c][0])}</div>`).join("")}`;
 for(let r=0;r<3;r++){
  h+=`<div class="tt-h row" title="${esc(CR[G.R[r]][1])}">${esc(CR[G.R[r]][0])}</div>`;
  for(let c=0;c<3;c++){
   const i=r*3+c,x=G.b[i],cls=["tt-c"];if(x)cls.push(x.w);if(G.sel===i)cls.push("sel");if(G.line.includes(i))cls.push("win");
   const st=x?(x.w==="p"?"tuya":"del bot")+": "+E[x.e][0]:"libre";
   h+=`<button class="${cls.join(" ")}" data-act="ttcell" data-i="${i}" ${x||G.over||G.turn!=="p"?"disabled":""} aria-label="${esc(cellName(i)+". "+st)}">${x?`<span class="tt-m" aria-hidden="true">${x.w==="p"?"✕":"○"}</span><span class="tt-n">${esc(E[x.e][0])}</span>`:""}</button>`;
  }
 }
 h+=`</div>`;
 if(G.sel!=null&&!G.over&&G.turn==="p"){
  h+=`<div class="tt-pick"><p class="tt-ph">Casilla: <b>${esc(rl(G.sel))}</b> × <b>${esc(cl(G.sel))}</b></p>
  <div class="ctrls" style="margin-top:0"><input class="fld gin" id="tt-q" value="${esc(G.q)}" placeholder="Escribe un personaje o dios…" autocomplete="off" aria-label="Nombre del personaje"><button class="btn" data-act="tthint" ${G.hn>=TT_MAXHINT||G.hint[G.sel]?"disabled":""}>Pista · −${TT_HINT}</button><button class="btn ghost" data-act="ttcancel">Cancelar</button></div>
  ${G.hint[G.sel]?`<p class="tt-hint">${esc(G.hint[G.sel])}</p>`:""}<ul class="tt-list" id="tt-list">${listHTML()}</ul></div>`;
 }

const oc2=A.choose;
Object.assign(A,{choose(b){if(C.hide&&C.hide.includes(+b.dataset.i))return;oc2(b)},
 hint50(){if(C.revealed||C.hinted||C.mode!=="trivia")return;const it=C.item;C.hide=[0,1,2,3].filter(i=>i!==it.ai).sort(()=>Math.random()-.5).slice(0,2);C.hinted=1;C.pts=Math.max(5,Math.round(C.pts/10)*5);render()},
 chint(){C.chint=1;render()}});
/* racha diaria */
const td=dayKey(new Date());
if(P.day!==td){const y=prevKey(td);P.dstreak=P.day===y?P.dstreak+1:1;P.day=td;const b=10*Math.min(P.dstreak,7);P.xp+=b;sv();setTimeout(()=>{banner(`📅 Día ${P.dstreak} seguido en la sala · <b>+${b} XP</b>`);ach()},900)}
hud();
})();
</script>
<script>
/* ===== retos diarios: enganches al terminar cada juego y arranque ===== */
(function(){
 const after=(k,fn)=>{const o=A[k];A[k]=function(b,e){const r=o.call(this,b,e);try{if(fn(b))render()}catch(x){console.error(x)}return r}};
 after("choose",()=>{if(!C||C.rec||!C.revealed||!(C.mode==="trivia"||C.mode==="vof")||C.chosen==null)return false;const w=C.chosen===C.item.ai;return dailyEnd(w,(w?"Acertaste: ":"Fallaste: ")+shortQ(C.item.q))});
 after("guess",()=>{if(!C||C.rec||C.mode!=="quien"||!C.revealed)return false;return dailyEnd(!C.lost,C.lost?"Era "+C.item.a:"Era "+C.item.a+" (pista "+C.clues+" de 5)")});
 after("imgguess",()=>{if(!C||C.rec||C.mode!=="imagen"||!C.revealed)return false;return dailyEnd(true,"Era "+C.item.answer)});
 after("giveup",()=>{if(!C||C.rec)return false;if(C.mode==="quien")return dailyEnd(false,"Era "+C.item.a);if(C.mode==="imagen")return dailyEnd(false,"Era "+C.item.answer);return false});
 after("ccheck",()=>{if(!C||C.rec||C.mode!=="crono")return false;return dailyEnd(C.cor>=3,C.cor+" de 4 en su lugar")});
 let lastDay=todayKey();
 reconcileDaily();
 render();initImagenes();
 setInterval(()=>{
  const el=$("#cd");if(el)el.textContent=cdText();
  const t=todayKey();
  if(t!==lastDay){lastDay=t;if(view==="home")render();else toast("Ya es otro día: vuelve a los juegos para ver los retos nuevos.")}
 },1000);
 document.addEventListener("visibilitychange",()=>{if(!document.hidden&&todayKey()!==lastDay){lastDay=todayKey();if(view==="home")render()}});
})();
</script>
<script type="module">
/* ===== Login con Firebase (misma cuenta/proyecto que tus otras páginas) ===== */
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,getDocs,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* >>> PEGA AQUÍ la config de tu proyecto (Firebase Console > Configuración del proyecto > Tus apps) <<< */
const FIREBASE_CONFIG={
 apiKey:"AIzaSyAsw466_wzsiLtbjw6FXZ1_O3HQ_AkVyU8",
 authDomain:"album-apexora.firebaseapp.com",
 projectId:"album-apexora",
 appId:"1:17231648284:web:20edb8477453f50473f1d9"
};
const AV_DIR="avatars/";                 // carpeta con los avatares (1x1), se muestran junto al nombre
const COL_PROFILES="apexora_profiles",COL_DATA="apexora_data";

const $g=s=>document.querySelector(s),gate=$g("#gate");
const E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const unlock=()=>document.documentElement.classList.remove("locked");
const lock=()=>document.documentElement.classList.add("locked");
const shell=h=>{gate.innerHTML=`<div class="gt-in"><div class="gt-brand">APEXORA</div>${h}</div>`};
const ERR={
 "auth/invalid-credential":"Contraseña incorrecta.","auth/wrong-password":"Contraseña incorrecta.","auth/user-not-found":"Ese perfil ya no existe.",
 "auth/too-many-requests":"Demasiados intentos. Espera un momento.","auth/email-already-in-use":"Ya existe un perfil con ese nombre.",
 "auth/weak-password":"La contraseña debe tener al menos 6 caracteres.","auth/network-request-failed":"Sin conexión. Revisa internet.",
 "permission-denied":"Firestore rechazó la operación. Revisa las reglas (ver firestore.rules.example)."};
const msg=e=>ERR[e&&e.code]||ERR[(e&&e.code||"").replace("firestore/","")]||("Error: "+(e&&e.message||e));

if(/TU_API_KEY|TU_PROYECTO/.test(JSON.stringify(FIREBASE_CONFIG))){
 shell(`<h1>Falta configurar Firebase</h1><p class="gt-note">Abre <code>index.html</code>, busca <code>FIREBASE_CONFIG</code> y pega la configuración de tu proyecto de Firebase.</p>`);
}else{
 let app,auth,db;
 try{app=initializeApp(FIREBASE_CONFIG);auth=getAuth(app);db=getFirestore(app)}catch(e){shell(`<h1>No se pudo iniciar Firebase</h1><p class="gt-note">${E(e.message)}</p>`)}
 if(auth)boot(auth,db);
}

function boot(auth,db){
 let profiles=[];
 const cached=()=>{try{return JSON.parse(localStorage.getItem("apexora-profile:"+APX_UID)||"null")}catch(e){return null}};
 async function loadProfiles(){
  const snap=await getDocs(collection(db,COL_PROFILES));
  profiles=snap.docs.map(d=>Object.assign({uid:d.id},d.data())).sort((a,b)=>(a.created||0)-(b.created||0));
 }
 const avImg=f=>f?`<img src="${E(AV_DIR+f)}" alt="">`:"";

 function viewPick(err){
  shell(`<h1>¿Quién juega?</h1><div class="gt-grid">${profiles.map((p,i)=>`<button class="gt-p" data-g="pick" data-i="${i}"><span class="av">${p.avatar?avImg(p.avatar):E(p.name[0]||"?")}</span><span class="n">${E(p.name)}</span></button>`).join("")}</div><p class="gt-err" role="alert" style="margin-top:22px">${E(err||"")}</p>`);
 }
 function viewPass(i,err){
  const p=profiles[i];
  shell(`<form class="gt-card" data-g="login" data-i="${i}"><div class="av">${p.avatar?avImg(p.avatar):""}</div><h1 style="font-size:1.6rem;margin:0 0 6px;text-align:center">${E(p.name)}</h1>
  <label>Contraseña<input class="fld" type="password" id="gpw" autocomplete="current-password" required></label><div class="gt-err" role="alert">${E(err||"")}</div>
  <button class="btn pri" type="submit">Entrar</button><button class="btn ghost" type="button" data-g="back">‹ Otros perfiles</button></form>`);
  const el=$g("#gpw");if(el)el.focus();
 }
 async function showPicker(err){
  shell(`<h1>Cargando perfiles…</h1>`);
  try{await loadProfiles()}catch(e){shell(`<h1>No se pudieron cargar los perfiles</h1><p class="gt-err">${E(msg(e))}</p><button class="btn pri" data-g="back">Reintentar</button>`);return}
  if(!profiles.length){shell(`<h1>Todavía no hay perfiles</h1><p class="gt-note">Cuando exista tu perfil, aparecerá aquí para que entres con tu contraseña.</p>`);return}
  viewPick(err);
 }
 /* al entrar: baja los datos de la nube si son más nuevos y reinicia con el perfil activo */
 async function enter(user,prof){
  const uid=user.uid;
  try{
   const d=await getDoc(doc(db,COL_DATA,uid));
   if(d.exists()){const x=d.data(),lts=+localStorage.getItem("apexora-ts:"+uid)||0;
    if((x.ts||0)>lts){
     if(x.s)localStorage.setItem("apexora-sala-v1:"+uid,x.s);
     if(x.p)localStorage.setItem("apexora-prog:"+uid,x.p);
     if(x.u)localStorage.setItem("apexora-crono-u:"+uid,x.u);
     localStorage.setItem("apexora-ts:"+uid,String(x.ts));
    }}
  }catch(e){}
  localStorage.setItem("apexora-profile:"+uid,JSON.stringify({name:prof.name,avatar:prof.avatar||""}));
  localStorage.setItem("apexora-uid",uid);
  location.reload();
 }
 gate.addEventListener("click",async e=>{
  const b=e.target.closest("[data-g]");if(!b||b.tagName==="FORM")return;const a=b.dataset.g;
  if(a==="pick")viewPass(+b.dataset.i);
  else if(a==="back")showPicker();
 });
 gate.addEventListener("submit",async e=>{
  const f=e.target.closest("form[data-g]");if(!f)return;e.preventDefault();
  const btn=f.querySelector("button[type=submit]"),err=f.querySelector(".gt-err");btn.disabled=true;entering=true;
  try{
   const p=profiles[+f.dataset.i],c=await signInWithEmailAndPassword(auth,p.login,$g("#gpw").value);
   await enter(c.user,p);
  }catch(x){entering=false;err.textContent=msg(x);btn.disabled=false}
 });
 window.FB={async logout(){try{await signOut(auth)}catch(e){}localStorage.removeItem("apexora-uid");location.reload()}};
 let t;
 window.cloudPush=()=>{const u=auth.currentUser;if(!u)return;clearTimeout(t);t=setTimeout(async()=>{
  try{const g=k=>localStorage.getItem(k+":"+u.uid)||"",ts=Date.now();localStorage.setItem("apexora-ts:"+u.uid,String(ts));
   await setDoc(doc(db,COL_DATA,u.uid),{s:g("apexora-sala-v1"),p:g("apexora-prog"),u:g("apexora-crono-u"),ts})}catch(e){}},1500)};
 let first=true,entering=false;
 onAuthStateChanged(auth,u=>{
  if(entering)return;
  if(u&&u.email&&u.email.endsWith("@apexora-sala.app")&&APX_UID!==u.uid){localStorage.setItem("apexora-uid",u.uid);location.reload();return}
  if(u&&APX_UID===u.uid){
   window.PROFILE=cached()||{name:"Jugador",avatar:""};
   unlock();if(first&&window.render)render();first=false;
   getDoc(doc(db,COL_PROFILES,u.uid)).then(s=>{if(s.exists()){const d=s.data();window.PROFILE={name:d.name,avatar:d.avatar||""};localStorage.setItem("apexora-profile:"+u.uid,JSON.stringify(window.PROFILE));window.render&&render()}}).catch(()=>{});
  }else{
   localStorage.removeItem("apexora-uid");lock();first=false;
   location.href="/Portal/?volver="+encodeURIComponent(location.href);   /* login único: se entra por el Portal */
  }
 });
}
</script>
<script type="module">
import { onSesion, registrarVisita, premiar, desbloquearLogro } from "https://apexora.github.io/Portal/apexora-core.js";
window.APX = { premiar, desbloquearLogro };
onSesion((u) => { if (u?.email?.endsWith("@apexora-sala.app")) registrarVisita(); });
</script>
